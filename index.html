<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121816">
<meta name="description" content="Portal e-portofolio Erika Pebri Nurvitasari, PPG Prajabatan PGSD.">
<title>E-Portofolio Erika Pebri Nurvitasari</title>
<style>
:root{--bg:#121816;--board:#1c2b25;--board-2:#15211c;--chalk:#eef1e6;--chalk-dim:#a9b5a8;--yellow:#f1d36b;--paper:#e8ebee;--grid:#cbd3da;--ink:#17233c;--blue:#2a4ba0;--red:#d4524a;--ease:cubic-bezier(.22,.8,.2,1);--serif:"Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",Georgia,serif;--sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--chalk);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--yellow);outline-offset:-3px}
[hidden]{display:none!important}

/* Halaman pilih semester */
#home{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr);height:100dvh;transition:opacity .5s var(--ease),transform .6s var(--ease),visibility .5s}
#home.away{opacity:0;transform:scale(.985);visibility:hidden;pointer-events:none}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:calc(14px + var(--sat)) clamp(16px,3vw,36px) 14px}
.brand{display:flex;align-items:center;gap:12px}
.mono{display:grid;place-items:center;width:38px;height:38px;border:1.5px solid var(--chalk);border-radius:50%;font:italic 700 15px var(--serif)}
.who strong{display:block;font-size:14px;font-weight:600;line-height:1.2}
.who span{display:block;margin-top:2px;color:var(--chalk-dim);font-size:12px}
.hint{display:flex;align-items:center;gap:8px;color:var(--chalk-dim);font-size:13px}
kbd{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border:1px solid #ffffff33;border-bottom-width:2px;border-radius:6px;color:var(--chalk);font:600 12px var(--sans)}

.rooms{display:flex;min-height:0}
.room{--mx:50%;--my:40%;position:relative;flex:1 1 0;min-width:0;overflow:hidden;border:0;padding:0;text-align:left;isolation:isolate;transition:flex-grow .9s var(--ease)}
.room:hover,.room:focus-visible{flex-grow:1.5}
.room::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .5s;background:radial-gradient(520px circle at var(--mx) var(--my),var(--spot),transparent 65%)}
.room:hover::before{opacity:1}
.board{--spot:rgba(238,241,230,.09);background:radial-gradient(120% 80% at 20% 0,#24372f,transparent 60%),var(--board);color:var(--chalk);animation:wipe-l 1.1s var(--ease) both}
.board::after{content:"";position:absolute;left:0;right:0;bottom:clamp(20px,5vh,44px);height:6px;background:linear-gradient(#0e1613,#0e1613) 0 0/100% 100%;opacity:.55;pointer-events:none}
.paper{--spot:rgba(255,255,255,.75);background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:30px 30px;color:var(--ink);animation:wipe-r 1.1s .12s var(--ease) both}
.paper .margin{position:absolute;top:0;bottom:0;left:clamp(28px,5vw,64px);width:2px;background:var(--red);opacity:.65}
@keyframes wipe-l{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
@keyframes wipe-r{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0)}}
.numeral{position:absolute;top:clamp(0px,2vh,24px);right:clamp(20px,5vw,70px);font:italic 700 clamp(200px,34vw,520px)/.85 var(--serif);color:transparent;pointer-events:none;transition:transform .9s var(--ease)}
.board .numeral{-webkit-text-stroke:2px rgba(238,241,230,.4)}
.paper .numeral{-webkit-text-stroke:2px rgba(42,75,160,.55)}
.room:hover .numeral,.room:focus-visible .numeral{transform:translateY(-10px) rotate(-2deg)}
.body{position:absolute;inset:auto 0 0 0;display:flex;flex-direction:column;align-items:flex-start;padding:0 clamp(24px,5vw,72px) clamp(40px,10vh,92px)}
.paper .body{padding-left:clamp(48px,8vw,104px)}
.title{margin:0 0 10px;font:700 clamp(36px,4.4vw,64px)/1 var(--serif);letter-spacing:-.02em}
.board .title{color:var(--chalk)}.paper .title{color:var(--ink)}
.sub{margin:0 0 6px;font:italic 400 clamp(17px,1.6vw,22px)/1.3 var(--serif)}
.board .sub{color:var(--yellow)}.paper .sub{color:var(--blue)}
.desc{margin:0;max-width:34ch;font-size:clamp(13px,1.05vw,15px);line-height:1.65}
.board .desc{color:var(--chalk-dim)}.paper .desc{color:#46526b}
.cta{display:flex;align-items:center;gap:12px;margin-top:22px;font-size:14px;font-weight:600}
.arrow{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;transition:transform .5s var(--ease),background .3s}
.arrow svg{width:16px;height:16px}
.board .arrow{border:1.5px solid var(--yellow);color:var(--yellow)}.paper .arrow{border:1.5px solid var(--blue);color:var(--blue)}
.room:hover .arrow,.room:focus-visible .arrow{transform:translateX(6px)}
.board:hover .arrow{background:var(--yellow);color:var(--board-2)}.paper:hover .arrow{background:var(--blue);color:#fff}

/* Gerak berkelanjutan */
.dust{position:absolute;inset:0;z-index:-1;pointer-events:none;background-size:340px 340px;background-image:radial-gradient(2px 2px at 12% 22%,rgba(238,241,230,.55),transparent),radial-gradient(1.5px 1.5px at 38% 71%,rgba(238,241,230,.4),transparent),radial-gradient(2.5px 2.5px at 66% 38%,rgba(238,241,230,.35),transparent),radial-gradient(1.5px 1.5px at 84% 84%,rgba(238,241,230,.5),transparent),radial-gradient(2px 2px at 52% 8%,rgba(241,211,107,.4),transparent);animation:dust 26s linear infinite}
.dust.d2{background-size:230px 230px;opacity:.7;animation-name:dust2;animation-duration:40s}
@keyframes dust{to{background-position:0 -340px}}
@keyframes dust2{to{background-position:0 -230px}}
.paper{animation:wipe-r 1.1s .12s var(--ease) both,gridmove 36s linear infinite}
@keyframes gridmove{to{background-position:30px 30px,30px 30px}}
.numeral{animation:drift 9s ease-in-out infinite}
.paper .numeral{animation-duration:11s;animation-delay:-4s}
@keyframes drift{50%{translate:0 -14px;rotate:1.5deg}}
.arrow{animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{50%{translate:4px 0}}
#home.away *{animation-play-state:paused}

/* Isi ruang: catatan, stiker, coretan */
.notes{position:absolute;z-index:1;top:clamp(20px,5vh,56px);left:clamp(24px,5vw,72px);display:grid;gap:12px;font:italic 400 clamp(15px,1.4vw,19px)/1.2 var(--serif);color:var(--chalk)}
.notes>span{display:flex;align-items:center;gap:12px;animation:write .9s var(--ease) both;animation-delay:calc(1s + var(--i)*.18s)}
.notes>span::before{content:"";flex:0 0 16px;height:9px;margin-top:-4px;border-left:2.5px solid var(--yellow);border-bottom:2.5px solid var(--yellow);rotate:-48deg}
@keyframes write{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 -8px 0 0)}}
.stickies{position:absolute;z-index:1;top:clamp(20px,5vh,56px);left:clamp(48px,8vw,104px);display:flex;flex-wrap:wrap;gap:14px;max-width:min(440px,46%)}
.sticky{--c:#f6e27a;position:relative;width:clamp(84px,8vw,112px);aspect-ratio:1;padding:18px 10px 8px;background:var(--c);color:#2c2a1c;font:italic 400 clamp(13px,1.15vw,16px)/1.2 var(--serif);box-shadow:0 6px 12px #17233c26;rotate:var(--r);transition:rotate .45s var(--ease),translate .45s var(--ease);animation:pop-in .7s var(--ease) both;animation-delay:calc(1.1s + var(--i)*.12s)}
.sticky::before{content:"";position:absolute;top:-7px;left:50%;width:34px;height:14px;translate:-50% 0;rotate:-3deg;background:#ffffffa6}
.sticky:hover{rotate:0deg;translate:0 -6px}
@keyframes pop-in{from{opacity:0;scale:.6;translate:0 14px}}
.dd{position:absolute;z-index:0;width:clamp(56px,7vw,100px);pointer-events:none;transform:translate(calc(var(--px,0)*var(--k,14)*1px),calc(var(--py,0)*var(--k,14)*1px));transition:transform .5s var(--ease)}
.dd svg{display:block;width:100%;overflow:visible;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;animation:bob var(--bd,8s) ease-in-out infinite}
.dd path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.8s var(--ease) forwards;animation-delay:calc(var(--d,1)*1s)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes bob{50%{translate:0 -10px;rotate:3deg}}
.scrawl{position:absolute;z-index:0;pointer-events:none;rotate:-6deg;font:400 clamp(20px,2.4vw,32px)/1 "Segoe Print","Bradley Hand","Chalkboard SE","Comic Sans MS",cursive;animation:bob 9s ease-in-out infinite}
.board .dd,.board .scrawl{color:rgba(238,241,230,.5)}
.paper .dd,.paper .scrawl{color:rgba(42,75,160,.62)}

/* Viewer */
#viewer{position:fixed;inset:0;z-index:100;background:var(--board-2);visibility:hidden;opacity:0;pointer-events:none;transition:opacity .5s var(--ease),visibility .5s}
#viewer.show{visibility:visible;opacity:1;pointer-events:auto}
#stage{position:absolute;inset:0;background:#fff}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;visibility:hidden;opacity:0;transition:opacity .4s}
#stage iframe.on{visibility:visible;opacity:1}
#load{position:absolute;z-index:3;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;background:var(--board);transition:opacity .4s,visibility .4s}
#load.done{opacity:0;visibility:hidden;pointer-events:none}
#lmsg{font:italic 400 18px/1.4 var(--serif);color:var(--chalk)}
.chalkline{width:min(220px,60vw);height:3px;border-radius:2px;background:#ffffff1f;overflow:hidden}
.chalkline i{display:block;width:40%;height:100%;border-radius:2px;background:var(--yellow);animation:slide 1.2s var(--ease) infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
#toast{position:absolute;z-index:6;left:50%;top:calc(14px + var(--sat));transform:translate(-50%,-8px);padding:10px 16px;border-radius:999px;background:var(--board-2);color:var(--chalk);font-size:13px;font-weight:600;box-shadow:0 8px 30px #0006;opacity:0;visibility:hidden;transition:.25s var(--ease)}
#toast.on{opacity:1;visibility:visible;transform:translate(-50%,0)}
#dock{position:absolute;z-index:8;left:0;top:0;display:grid;place-items:center;width:52px;height:52px;padding:0;border:1.5px solid #ffffff40;border-radius:50%;background:rgba(21,33,28,.88);color:var(--chalk);box-shadow:0 8px 28px #0007;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;transition:opacity .35s,transform .25s var(--ease)}
#dock.snap{transition:left .4s var(--ease),top .4s var(--ease),opacity .35s,transform .25s}
#dock.idle{opacity:.45}#dock.drag{cursor:grabbing;transform:scale(1.1);transition:none}
#dock svg{width:22px;height:22px;pointer-events:none}
#menu{position:absolute;z-index:9;left:0;top:0;width:min(300px,calc(100vw - 24px));padding:10px;border:1px solid #ffffff2a;border-radius:18px;background:rgba(21,33,28,.97);box-shadow:0 22px 60px #000a;animation:pop .22s var(--ease) both}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}}
.mh{display:flex;align-items:center;justify-content:space-between;padding:6px 6px 10px;margin-bottom:4px;border-bottom:1px solid #ffffff1f}
.mh small{display:block;color:var(--chalk-dim);font-size:12px}.mh strong{font:700 17px var(--serif)}
.x{display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:50%;background:#ffffff14;font-size:20px;line-height:1}
.act{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:8px;border:0;border-radius:12px;background:transparent;text-align:left;transition:background .2s}
.act:hover{background:#ffffff12}
.act svg{flex:0 0 36px;width:36px;height:36px;padding:9px;border-radius:50%;background:#ffffff14;color:var(--yellow)}
.act b{display:block;font-size:14px;font-weight:600}.act span span{display:block;margin-top:2px;color:var(--chalk-dim);font-size:12px}

@media(max-width:760px){
 .hint{display:none}
 .rooms{flex-direction:column}
 .room:hover,.room:focus-visible{flex-grow:1}
 .board{animation-name:wipe-t}.paper{animation-name:wipe-b,gridmove}
 .notes{top:16px;left:22px;gap:7px;font-size:15px}.notes>span:nth-child(n+4){display:none}
 .stickies{top:18px;left:46px;gap:10px;max-width:58%}.sticky{width:74px;padding:14px 7px 6px;font-size:12px}.sticky:nth-child(n+4){display:none}
 .dd{width:48px}.scrawl{display:none}
 .numeral{font-size:clamp(170px,52vw,260px);right:10px;top:-6px}
 .body{padding:0 22px 26px}.paper .body{padding-left:46px}
 .paper .margin{left:30px}
 .title{font-size:34px}.desc{font-size:13px;max-width:30ch}.cta{margin-top:14px}
 .board::after{bottom:14px}
}
@keyframes wipe-t{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
@keyframes wipe-b{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0)}}
@media(max-height:700px) and (max-width:760px){.notes,.stickies,.dd{display:none}}
@media(max-height:620px) and (min-width:761px){.notes,.stickies{display:none}}
@media(max-height:560px) and (min-width:761px){.numeral{font-size:260px}.body{padding-bottom:28px}.desc{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}


/* === Lapisan visual tambahan: immersive learning journal === */
.bar{position:relative;z-index:5;min-height:70px}
.mono{position:relative;overflow:hidden;background:linear-gradient(145deg,#ffffff13,transparent);box-shadow:inset 0 0 0 1px #ffffff08,0 0 22px #f1d36b0b;transition:transform .4s var(--ease),border-color .4s}
.mono::after{content:"";position:absolute;inset:-70% 38%;width:24%;background:#f1d36b66;transform:rotate(28deg) translateY(-60%);animation:logo-glint 7s ease-in-out infinite}
@keyframes logo-glint{0%,68%,100%{transform:rotate(28deg) translateY(-90%)}82%{transform:rotate(28deg) translateY(90%)}}
.brand:hover .mono{transform:rotate(-8deg) scale(1.04);border-color:var(--yellow)}
.hint{letter-spacing:.12em;font-size:10px;font-weight:700}
.hint kbd{letter-spacing:0;border-radius:50%;width:25px;height:25px;border-color:#ffffff42;background:#ffffff08}
.hint-line{display:block;width:clamp(22px,5vw,70px);height:1px;margin-left:4px;background:linear-gradient(90deg,var(--yellow),transparent);opacity:.8}
.rooms{position:relative;isolation:isolate}
.room{isolation:isolate;transition:flex-grow .9s var(--ease),filter .6s var(--ease)}
.room:not(:hover){filter:saturate(.94)}
.board{background-image:radial-gradient(ellipse at 68% 42%,#35524366,transparent 45%),radial-gradient(ellipse at 5% 90%,#0b151166,transparent 55%),repeating-linear-gradient(116deg,#ffffff02 0 1px,transparent 1px 8px),linear-gradient(145deg,#1c2b25,#17231e 72%)}
.paper{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),radial-gradient(ellipse at 70% 38%,#ffffffb8,transparent 55%),linear-gradient(130deg,#f1f2f2,#dfe4e8);background-size:30px 30px,30px 30px,100% 100%,100% 100%;background-blend-mode:multiply,multiply,screen,normal}
.board{animation:wipe-l 1.1s var(--ease) both,board-breathe 15s ease-in-out 1.1s infinite alternate}
@keyframes board-breathe{0%{background-position:0 0,0 0,0 0,0 0}100%{background-position:0 0,8% -4%,30px 0,0 0}}
.ambient-wash{position:absolute;z-index:0;inset:0;pointer-events:none;opacity:.62;background:radial-gradient(ellipse at 68% 43%,#f1d36b16,transparent 42%),radial-gradient(ellipse at 78% 75%,#8bb8a51c,transparent 38%);animation:ambient-pulse 10s ease-in-out infinite alternate}
.paper .ambient-wash{background:radial-gradient(ellipse at 65% 42%,#ffffffbb,transparent 44%),radial-gradient(ellipse at 90% 80%,#82a8ec28,transparent 36%);opacity:.7;animation-duration:13s}
@keyframes ambient-pulse{0%{opacity:.3;transform:scale(1)}100%{opacity:.82;transform:scale(1.06)}}
.light-sweep{position:absolute;z-index:0;top:-20%;bottom:-20%;left:-35%;width:23%;pointer-events:none;opacity:0;background:linear-gradient(90deg,transparent,#ffffff0c,transparent);transform:skewX(-18deg);animation:light-sweep 13s ease-in-out infinite}
.paper .light-sweep{background:linear-gradient(90deg,transparent,#fff9,transparent);animation-delay:-5s;animation-duration:16s}
@keyframes light-sweep{0%,18%{left:-35%;opacity:0}32%{opacity:.9}58%,100%{left:125%;opacity:0}}
.room-stamp{position:absolute;z-index:2;top:clamp(22px,5vh,58px);right:clamp(22px,4vw,58px);display:flex;align-items:center;gap:9px;color:#eef1e68a;font-size:9px;font-weight:700;letter-spacing:.17em;white-space:nowrap;animation:stamp-in .8s .75s var(--ease) both}
.room-stamp i,.section-index i{display:block;width:6px;height:6px;flex:0 0 6px;border-radius:50%;background:var(--yellow);box-shadow:0 0 12px #f1d36b9c;animation:status-beat 2.4s ease-in-out infinite}
.room-stamp b{padding:5px 7px;border:1px solid #ffffff30;border-radius:5px;font-size:9px;font-weight:600;letter-spacing:.08em}
.paper .room-stamp{color:#273d63a6}
.paper .room-stamp i{background:var(--blue);box-shadow:0 0 12px #2a4ba055}
.paper .room-stamp b{border-color:#2a4ba044}
@keyframes status-beat{50%{opacity:.35;box-shadow:0 0 2px transparent}}
@keyframes stamp-in{from{opacity:0;translate:0 -8px;letter-spacing:.3em}to{opacity:1;translate:0 0}}
.scene{position:absolute;z-index:0;top:47%;left:65%;width:clamp(220px,27vw,390px);aspect-ratio:1;pointer-events:none;color:#eef1e6a8;transform:translate(calc(-50% + var(--scene-x,0px)),calc(-50% + var(--scene-y,0px)));transition:transform .6s var(--ease);filter:drop-shadow(0 12px 24px #00000012)}
.scene-board{left:64%;top:46%}
.scene-paper{left:65%;top:45%;color:#2a4ba0a8}
.scene-ring{position:absolute;display:block;inset:0;border:1px solid currentColor;border-radius:50%;opacity:.22;transform-origin:center;animation:orbit-turn 34s linear infinite}
.scene-ring.ring-a{inset:2%;border-style:dashed;opacity:.32;animation-duration:40s}
.scene-ring.ring-b{inset:14%;border-style:dotted;opacity:.35;animation-duration:27s;animation-direction:reverse}
.scene-ring.ring-c{inset:28%;border-style:solid;border-color:currentColor;opacity:.12;animation-duration:19s}
@keyframes orbit-turn{to{rotate:360deg}}
.scene-core{position:absolute;top:50%;left:50%;display:grid;place-items:center;width:34%;aspect-ratio:1;transform:translate(-50%,-50%) rotate(-7deg);border:1px solid #eef1e64a;border-radius:31% 40% 30% 42%;background:linear-gradient(145deg,#ffffff0d,#ffffff02);box-shadow:0 0 0 12px #ffffff04,0 0 55px #f1d36b0b;backdrop-filter:blur(2px);animation:core-float 6s ease-in-out infinite}
.scene-core svg{width:67%;height:67%;overflow:visible;filter:drop-shadow(0 0 8px currentColor)}
.scene-paper .scene-core{border-color:#2a4ba044;border-radius:20%;background:linear-gradient(145deg,#ffffffc9,#ffffff40);box-shadow:0 12px 30px #2a4ba017,0 0 0 12px #ffffff4d;transform:translate(-50%,-50%) rotate(8deg);animation:paper-float 7s ease-in-out infinite}
@keyframes core-float{0%,100%{translate:0 0;rotate:-3deg}50%{translate:0 -10px;rotate:4deg}}
@keyframes paper-float{0%,100%{translate:0 0;rotate:6deg}50%{translate:0 -12px;rotate:12deg}}
.scene-orbit-dot{position:absolute;z-index:2;display:block;width:9px;height:9px;border:2px solid currentColor;border-radius:50%;background:var(--board);box-shadow:0 0 16px currentColor;animation:dot-pop 3.2s ease-in-out infinite}
.scene-paper .scene-orbit-dot{background:var(--paper)}
.dot-a{left:17%;top:22%;animation-delay:-1s}.dot-b{right:11%;bottom:24%;width:6px;height:6px;animation-delay:-2s}
@keyframes dot-pop{0%,100%{scale:.75;opacity:.5}50%{scale:1.3;opacity:1}}
.scene-label{position:absolute;display:flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid #eef1e626;border-radius:3px;background:#13201999;color:#eef1e6bf;font-size:8px;font-weight:700;letter-spacing:.15em;white-space:nowrap;backdrop-filter:blur(8px);animation:label-drift 8s ease-in-out infinite}
.label-a{top:19%;right:-2%}.label-b{bottom:17%;left:-8%;animation-delay:-4s}
.scene-label b{padding-left:6px;border-left:1px solid #ffffff38;color:var(--yellow);font-weight:600}
.scene-paper .scene-label{border-color:#2a4ba033;background:#f8fafbd9;color:#2a4ba0c7;box-shadow:0 8px 18px #17233c0c}
.scene-paper .scene-label b{border-color:#2a4ba044;color:var(--blue)}
@keyframes label-drift{0%,100%{translate:0 0}50%{translate:0 -5px}}
.scene-spark{position:absolute;color:var(--yellow);font-size:20px;animation:spark-twinkle 4s ease-in-out infinite}
.spark-a{top:6%;left:28%}.spark-b{bottom:6%;right:24%;font-size:17px;animation-delay:-2.2s}
.scene-paper .scene-spark{color:var(--blue)}
@keyframes spark-twinkle{0%,100%{opacity:.35;scale:.7;rotate:0deg}50%{opacity:1;scale:1.15;rotate:35deg}}
.section-index{display:flex;align-items:center;gap:9px;margin:0 0 16px;font-size:9px;font-weight:700;letter-spacing:.17em;color:#eef1e680;animation:stamp-in .8s .55s var(--ease) both}
.section-index b{margin-left:3px;padding-left:10px;border-left:1px solid #ffffff35;font-weight:600;color:#eef1e69c}
.paper .section-index{color:#2a4ba0a3}
.paper .section-index i{background:var(--blue);box-shadow:0 0 12px #2a4ba055}
.paper .section-index b{border-color:#2a4ba044;color:#2a4ba0b3}
.body{z-index:2}
.title{letter-spacing:-.035em;text-shadow:0 5px 28px #00000012}
.board .title{ text-shadow:0 4px 24px #0005 }
.paper .title{text-shadow:0 4px 18px #2a4ba012}
.sub{position:relative;display:inline-block}
.sub::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:1px;background:currentColor;opacity:.35;transform-origin:left;animation:underline-grow 1s .7s var(--ease) both}
@keyframes underline-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.cta{letter-spacing:.015em}
.arrow{box-shadow:0 0 0 0 #f1d36b00}
.board:hover .arrow{box-shadow:0 0 0 6px #f1d36b13}
.paper:hover .arrow{box-shadow:0 0 0 6px #2a4ba015}
.room:hover .scene{filter:drop-shadow(0 15px 35px #00000018)}
.room:hover .scene-core{box-shadow:0 0 0 16px #ffffff06,0 0 70px #f1d36b18}
.paper:hover .scene-core{box-shadow:0 14px 36px #2a4ba01c,0 0 0 16px #ffffff58}
.board:hover .room-stamp,.paper:hover .room-stamp{color:var(--chalk)}
.paper:hover .room-stamp{color:var(--blue)}
@media(max-width:760px){
 .bar{min-height:62px;padding-bottom:10px}
 .mono{width:33px;height:33px;font-size:13px}
 .room-stamp{top:17px;right:18px;font-size:7px;gap:6px;letter-spacing:.1em}
 .room-stamp b{padding:4px 5px;font-size:8px}
 .scene{width:clamp(170px,38vw,240px);left:68%;top:43%;opacity:.88}
 .scene-board{left:70%;top:41%}.scene-paper{left:70%;top:40%}
 .scene-label{font-size:6px;padding:5px 6px;letter-spacing:.1em}
 .label-a{right:-6%}.label-b{left:-1%}
 .scene-core{width:36%}
 .section-index{font-size:8px;gap:7px;margin-bottom:11px;letter-spacing:.12em}
 .body{padding-top:0}
 .board .notes{z-index:2}
 .light-sweep{width:32%;animation-duration:17s}
}
@media(max-width:390px){
 .room-stamp{font-size:6px;right:12px;gap:4px}.room-stamp b{display:none}
 .scene{width:160px;left:74%;opacity:.74}
 .scene-label{display:none}
 .section-index b{display:none}
}
@media(max-height:700px) and (max-width:760px){.scene,.room-stamp,.section-index{display:none}}
@media(max-height:620px) and (min-width:761px){.scene{width:220px}.room-stamp{top:18px}.section-index{margin-bottom:8px}}
@media(prefers-reduced-motion:reduce){
 .mono::after,.ambient-wash,.light-sweep,.room-stamp,.scene-ring,.scene-core,.scene-orbit-dot,.scene-label,.scene-spark,.section-index,.sub::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

</style>
</head>
<body>
<main id="home" aria-label="Pilih semester">
 <header class="bar">
  <div class="brand"><div class="mono" aria-hidden="true">EP</div><div class="who"><strong>Erika Pebri Nurvitasari</strong><span>PPG Prajabatan PGSD</span></div></div>
  <div class="hint"><span>PILIH SEMESTER</span><kbd>1</kbd><kbd>2</kbd><span class="hint-line"></span></div>
 </header>
 <section class="rooms">

   <span class="dust" aria-hidden="true"></span><span class="dust d2" aria-hidden="true"></span>

    <span class="room-stamp"><i></i> REFLECTION JOURNAL <b>01</b></span>
    <span class="scene scene-board" aria-hidden="true"><span class="scene-ring ring-a"></span><span class="scene-ring ring-b"></span><span class="scene-ring ring-c"></span><span class="scene-orbit-dot dot-a"></span><span class="scene-orbit-dot dot-b"></span><span class="scene-core"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M50 27C39 18 22 20 15 26v43c11-7 24-5 35 4 11-9 24-11 35-4V26c-7-6-24-8-35 1Z"/><path d="M50 28v45M23 35c8-3 15-1 20 2M23 45c7-2 14 0 19 3M77 35c-8-3-15-1-20 2M77 45c-7-2-14 0-19 3"/><path d="M65 10c7 0 12 4 13 10-7 3-13 0-13-10Z"/></svg></span><span class="scene-label label-a">LEARN · REFLECT · GROW</span><span class="scene-label label-b">FIELD NOTES <b>2026</b></span><span class="scene-spark spark-a">✳</span><span class="scene-spark spark-b">✦</span></span>
    <span class="notes"><span style="--i:0">Profil dan jati diri</span><span style="--i:1">Artefak pembelajaran</span><span style="--i:2">Refleksi tiap siklus</span><span style="--i:3">Penilaian</span></span><span class="dd" style="top:42%;left:46%;--k:22;--bd:8s;--d:1.2" aria-hidden="true"><svg viewBox="0 0 100 100"><path pathLength="1" d="M50 30c-14-10-32 2-28 24 3 18 16 30 28 24 12 6 25-6 28-24 4-22-14-34-28-24z"/><path pathLength="1" d="M50 30c0-8 4-14 12-16"/><path pathLength="1" d="M56 22c8-6 16-4 18 2-8 4-14 3-18-2z"/></svg></span><span class="dd" style="top:12%;left:45%;--k:12;--bd:10s;--d:1.5;width:clamp(40px,4.5vw,64px)" aria-hidden="true"><svg viewBox="0 0 100 100"><path pathLength="1" d="M50 8l11 27 29 3-22 19 7 29-25-15-25 15 7-29L10 38l29-3z"/></svg></span><span class="dd" style="top:50%;right:9%;--k:30;--bd:9s;--d:1.8" aria-hidden="true"><svg viewBox="0 0 100 100"><path pathLength="1" d="M50 12a24 24 0 0 0-12 45v10h24V57a24 24 0 0 0-12-45z"/><path pathLength="1" d="M40 78h20"/><path pathLength="1" d="M43 88h14"/></svg></span><span class="scrawl" style="top:64%;right:6%">2 + 3 = 5</span><span class="scrawl" style="top:7%;left:54%;rotate:5deg">a b c</span>
   <span class="numeral" aria-hidden="true">1</span>
   <span class="body">
    <span class="section-index"><i></i> PORTFOLIO / 01 <b>FOUNDATION</b></span>
    <h2 class="title">Semester 1</h2>
    <p class="sub">Landasan belajar</p>
    <p class="desc">Profil, artefak, refleksi siklus, dan penilaian sebagai pendidik.</p>
    <span class="cta">Buka portofolio <span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></span>
   </span>
  </button>
  <button class="room paper" type="button" data-site="b" aria-label="Buka E-Portofolio Semester 2">
   <span class="margin" aria-hidden="true"></span>
    <span class="ambient-wash" aria-hidden="true"></span><span class="light-sweep" aria-hidden="true"></span>
    <span class="room-stamp"><i></i> PRACTICE ARCHIVE <b>02</b></span>
    <span class="scene scene-paper" aria-hidden="true"><span class="scene-ring ring-a"></span><span class="scene-ring ring-b"></span><span class="scene-ring ring-c"></span><span class="scene-orbit-dot dot-a"></span><span class="scene-orbit-dot dot-b"></span><span class="scene-core"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m24 70 5-19 36-36 18 18-36 36-23 7Z"/><path d="m56 24 18 18M29 51l18 18M24 70l-2 9 9-2"/><path d="M18 20h22M18 29h13M66 77h17M66 85h12"/></svg></span><span class="scene-label label-a">DESIGN → TEACH → REFLECT</span><span class="scene-label label-b">PRACTICUM <b>02</b></span><span class="scene-spark spark-a">✳</span><span class="scene-spark spark-b">＋</span></span>
    <span class="stickies"><span class="sticky" style="--i:0;--r:-4deg">Dokumentasi PPL</span><span class="sticky" style="--i:1;--r:3deg;--c:#a9d8f0">Rancangan</span><span class="sticky" style="--i:2;--r:-2deg;--c:#b8e3b0">Materi dan media</span><span class="sticky" style="--i:3;--r:4deg;--c:#f7c59a">Video praktik</span><span class="sticky" style="--i:4;--r:-3deg">Instrumen</span></span><span class="dd" style="top:44%;left:55%;--k:20;--bd:9s;--d:1.2" aria-hidden="true"><svg viewBox="0 0 100 100"><path pathLength="1" d="M18 82l6-20 44-44 14 14-44 44-20 6z"/><path pathLength="1" d="M60 26l14 14"/><path pathLength="1" d="M24 62l14 14"/></svg></span><span class="dd" style="top:13%;left:58%;--k:14;--bd:11s;--d:1.6;width:clamp(40px,4.5vw,64px)" aria-hidden="true"><svg viewBox="0 0 100 100"><path pathLength="1" d="M64 30L34 62a10 10 0 0 0 14 14l36-38a16 16 0 0 0-22-22L26 56a22 22 0 0 0 31 31l30-32"/></svg></span><span class="dd" style="top:54%;right:9%;--k:28;--bd:8s;--d:1.9;width:clamp(44px,5vw,72px)" aria-hidden="true"><svg viewBox="0 0 100 100"><path pathLength="1" d="M50 8l11 27 29 3-22 19 7 29-25-15-25 15 7-29L10 38l29-3z"/></svg></span><span class="dd" style="top:60%;left:50%;--k:10;--bd:12s;--d:2.1;width:clamp(80px,9vw,130px)" aria-hidden="true"><svg viewBox="0 0 110 40"><path pathLength="1" d="M5 20q10-14 20 0t20 0 20 0 20 0 20 0"/></svg></span><span class="scrawl" style="top:68%;right:5%;rotate:-5deg">belajar, bertumbuh</span>
   <span class="numeral" aria-hidden="true">2</span>
   <span class="body">
    <span class="section-index"><i></i> PORTFOLIO / 02 <b>APPLICATION</b></span>
    <h2 class="title">Semester 2</h2>
    <p class="sub">Praktik mengajar</p>
    <p class="desc">Dokumentasi PPL, rancangan, materi, media, video praktik, dan instrumen penilaian.</p>
    <span class="cta">Buka portofolio <span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></span>
   </span>
  </button>
 </section>
</main>

<section id="viewer" aria-label="Portofolio" aria-hidden="true">
 <div id="stage"></div>
 <div id="load" role="status" aria-live="polite"><span id="lmsg">Membuka portofolio…</span><span class="chalkline"><i></i></span></div>
 <div id="toast" role="status" aria-live="polite"></div>
 <button id="dock" type="button" aria-label="Buka menu navigasi" aria-expanded="false" aria-controls="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
 <div id="menu" role="dialog" aria-label="Navigasi portofolio" hidden>
  <div class="mh"><div><small>Sedang dibuka</small><strong id="cur">Semester 1</strong></div><button class="x" id="mclose" type="button" aria-label="Tutup menu">×</button></div>
  <button class="act" id="goHome" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7M6 10v10h12V10"/></svg><span><b>Pilih semester lain</b><span>Kembali ke halaman awal</span></span></button>
  <button class="act" id="swap" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h12l-3-3M17 17H5l3 3"/></svg><span><b id="swapl">Pindah ke Semester 2</b><span>Langsung, tanpa kembali ke awal</span></span></button>
  <button class="act" id="newtab" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5H5V6h5"/></svg><span><b>Buka di tab baru</b><span>Pakai jika situs tidak tampil di sini</span></span></button>
 </div>
</section>

<script>
(()=>{'use strict';
const SITES={
 a:{name:'Semester 1',url:'https://erikapebrinurvitasari.github.io/Eportofolio-Semester-1/',hash:'#semester-1'},
 b:{name:'Semester 2',url:'https://erikapebrinurvitasari.github.io/Eportofolio-Semester-2/#beranda',hash:'#semester-2'}
};
const $=s=>document.querySelector(s);
const home=$('#home'),viewer=$('#viewer'),stage=$('#stage'),load=$('#load'),lmsg=$('#lmsg'),dock=$('#dock'),menu=$('#menu'),toast=$('#toast');
const rooms=[...document.querySelectorAll('.room')];
const frames={};let active=null,lastRoom=null,slowT,toastT,idleT,justDragged=false;
const M=10,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let pos={side:'r',y:.72};
try{const s=JSON.parse(localStorage.getItem('ep-dock'));if(s&&(s.side==='l'||s.side==='r')&&typeof s.y==='number')pos=s;}catch(_){}

/* Loader */
function showLoad(msg){load.classList.remove('done');lmsg.textContent=msg;clearTimeout(slowT);slowT=setTimeout(()=>{if(!load.classList.contains('done'))lmsg.textContent='Agak lama. Coba "Buka di tab baru" dari tombol menu.';},10000);}
function hideLoad(){clearTimeout(slowT);load.classList.add('done');}
function say(m){toast.textContent=m;toast.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>toast.classList.remove('on'),1700);}

/* Dock dan menu */
function place(snap){const sz=dock.offsetWidth||52;dock.classList.toggle('snap',!!snap);dock.style.left=(pos.side==='l'?M:innerWidth-sz-M)+'px';dock.style.top=clamp(pos.y*innerHeight,M+40,innerHeight-sz-M-20)+'px';}
function placeMenu(){const b=dock.getBoundingClientRect(),w=menu.offsetWidth,h=menu.offsetHeight;const l=b.left+b.width/2>innerWidth/2?b.right-w:b.left,t=b.top+b.height/2>innerHeight/2?b.top-h-10:b.bottom+10;menu.style.left=clamp(l,M,innerWidth-w-M)+'px';menu.style.top=clamp(t,M,innerHeight-h-M)+'px';}
function wake(){dock.classList.remove('idle');clearTimeout(idleT);if(menu.hidden&&active)idleT=setTimeout(()=>dock.classList.add('idle'),2600);}
function setMenu(o){menu.hidden=!o;dock.setAttribute('aria-expanded',String(o));if(o){placeMenu();$('#goHome').focus({preventScroll:true});}wake();}

/* Iframe dibuat sekali dan tidak dipindah, supaya tidak reload */
function frame(k){if(frames[k])return frames[k];const f=document.createElement('iframe');
 f.title='E-Portofolio '+SITES[k].name;f.referrerPolicy='strict-origin-when-cross-origin';
 f.allow='fullscreen; autoplay; encrypted-media; picture-in-picture; clipboard-write';f.setAttribute('allowfullscreen','');
 f.addEventListener('load',()=>{f.dataset.ok='1';if(active===k)hideLoad();});
 f.src=SITES[k].url;frames[k]=f;stage.appendChild(f);return f;}
const keyFromHash=()=>Object.keys(SITES).find(k=>SITES[k].hash===location.hash)||null;

function open(k,o={}){const s=SITES[k];if(!s)return;const prev=active,f=frame(k);active=k;
 home.classList.add('away');home.inert=true;viewer.classList.add('show');viewer.setAttribute('aria-hidden','false');
 Object.keys(frames).forEach(x=>frames[x].classList.toggle('on',x===k));
 f.dataset.ok==='1'?hideLoad():showLoad('Membuka '+s.name+'…');
 $('#cur').textContent=s.name;$('#swapl').textContent='Pindah ke '+SITES[k==='a'?'b':'a'].name;
 menu.hidden=true;dock.setAttribute('aria-expanded','false');place(false);wake();
 if(o.push!==false)history[prev?'replaceState':'pushState']({ep:k},'',s.hash);
 if(prev&&prev!==k)say('Beralih ke '+s.name);}

function close(){if(!active)return;active=null;menu.hidden=true;dock.setAttribute('aria-expanded','false');
 viewer.classList.remove('show');viewer.setAttribute('aria-hidden','true');
 Object.values(frames).forEach(f=>f.classList.remove('on'));
 home.classList.remove('away');home.inert=false;hideLoad();
 if(location.hash.startsWith('#semester-'))history.replaceState(null,'',location.pathname+location.search);
 if(lastRoom)lastRoom.focus({preventScroll:true});}

/* Interaksi halaman awal */
rooms.forEach(r=>{
 r.addEventListener('click',()=>{lastRoom=r;open(r.dataset.site);});
 r.addEventListener('pointermove',e=>{const b=r.getBoundingClientRect();r.style.setProperty('--mx',(e.clientX-b.left)+'px');r.style.setProperty('--my',(e.clientY-b.top)+'px');r.style.setProperty('--px',((e.clientX-b.left)/b.width-.5)*2);r.style.setProperty('--py',((e.clientY-b.top)/b.height-.5)*2);r.style.setProperty('--scene-x',(((e.clientX-b.left)/b.width)-.5)*18+'px');r.style.setProperty('--scene-y',(((e.clientY-b.top)/b.height)-.5)*14+'px');});
 r.addEventListener('pointerleave',()=>{r.style.setProperty('--px',0);r.style.setProperty('--py',0);r.style.setProperty('--scene-x','0px');r.style.setProperty('--scene-y','0px');});
});

/* Dock: klik membuka menu, tarik memindahkan */
{let sx=0,sy=0,ox=0,oy=0,down=false,moved=false;
 dock.addEventListener('pointerdown',e=>{down=true;moved=false;sx=e.clientX;sy=e.clientY;const r=dock.getBoundingClientRect();ox=r.left;oy=r.top;dock.setPointerCapture(e.pointerId);wake();});
 dock.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(!moved&&Math.hypot(dx,dy)<6)return;
  if(!moved){moved=true;menu.hidden=true;dock.setAttribute('aria-expanded','false');dock.classList.remove('snap');dock.classList.add('drag');}
  dock.style.left=clamp(ox+dx,M,innerWidth-dock.offsetWidth-M)+'px';dock.style.top=clamp(oy+dy,M,innerHeight-dock.offsetHeight-M)+'px';});
 const end=()=>{if(!down)return;down=false;dock.classList.remove('drag');
  if(moved){justDragged=true;setTimeout(()=>justDragged=false,80);const r=dock.getBoundingClientRect();pos={side:r.left+r.width/2<innerWidth/2?'l':'r',y:r.top/innerHeight};try{localStorage.setItem('ep-dock',JSON.stringify(pos));}catch(_){}place(true);}
  wake();};
 dock.addEventListener('pointerup',end);dock.addEventListener('pointercancel',end);}
dock.addEventListener('click',()=>{if(justDragged){justDragged=false;return;}setMenu(menu.hidden);});
$('#mclose').addEventListener('click',()=>{setMenu(false);dock.focus({preventScroll:true});});
$('#goHome').addEventListener('click',close);
$('#swap').addEventListener('click',()=>{if(active)open(active==='a'?'b':'a');});
$('#newtab').addEventListener('click',()=>{if(active)window.open(SITES[active].url,'_blank','noopener,noreferrer');});

/* Menu tertutup saat pengguna mengetuk situs di dalam iframe (iframe lintas domain tidak mengirim event ke sini) */
document.addEventListener('pointerdown',e=>{if(!menu.hidden&&!menu.contains(e.target)&&!dock.contains(e.target))setMenu(false);});
addEventListener('blur',()=>{if(!menu.hidden)setMenu(false);});
addEventListener('resize',()=>{place(false);if(!menu.hidden)placeMenu();});

/* Keyboard */
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(!menu.hidden){setMenu(false);dock.focus({preventScroll:true});}else if(active)close();return;}
 if(active||e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.key==='1'||e.key==='2'){lastRoom=rooms[+e.key-1];open(e.key==='1'?'a':'b');}
 else if(e.key==='ArrowLeft')rooms[0].focus();
 else if(e.key==='ArrowRight')rooms[1].focus();});

/* Tombol Back dan alamat langsung (#semester-1 / #semester-2) */
addEventListener('popstate',()=>{const k=keyFromHash();if(k)open(k,{push:false});else if(active)close();});
addEventListener('pageshow',()=>{const k=keyFromHash();if(k&&!active)open(k,{push:false});});
place(false);

/* Siapkan kedua semester di latar setelah halaman selesai dimuat */
addEventListener('load',()=>{const c=navigator.connection;if(c&&(c.saveData||/2g/.test(c.effectiveType||'')))return;
 const idle=window.requestIdleCallback||(fn=>setTimeout(fn,1000));
 idle(()=>{frame('a');setTimeout(()=>frame('b'),700);},{timeout:2500});},{once:true});
})();
</script>
</body>
</html>
